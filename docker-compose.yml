version: '2.4'

services:
  ################################################################################
  # PostgreSQL
  ################################################################################
  db:
    image: postgres:16-alpine
    container_name: znaymed-db
    restart: always
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - znaymed-net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  ################################################################################
  # pgAdmin
  ################################################################################
  pgadmin:
    image: dpage/pgadmin4:8.5
    container_name: znaymed-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT:      5050
    volumes:
      - pgadmin_storage:/var/lib/pgadmin
    ports:
      - "5050:5050"
    networks:
      - znaymed-net

  ################################################################################
  # Auth micro-service (gRPC :50054)
  ################################################################################
  auth-service:
    build:
      context: .
      dockerfile: build/go.Dockerfile
      args:
        SERVICE_PATH: services/auth-service
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_HOST:     db
      DB_PORT:     "5432"
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME:     ${DB_NAME}
    ports:
      - "50054:50054"
    networks:
      - znaymed-net

  ################################################################################
  # Course micro-service (gRPC :50053)
  ################################################################################
  course-service:
    build:
      context: .
      dockerfile: build/go.Dockerfile
      args:
        SERVICE_PATH: services/course-service
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_HOST:     db
      DB_PORT:     "5432"
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME:     ${DB_NAME}
    ports:
      - "50053:50053"
    networks:
      - znaymed-net

  ################################################################################
  # API-gateway (HTTP :8080)
  ################################################################################
  api-gateway:
    build:
      context: .
      dockerfile: build/go.Dockerfile
      args:
        SERVICE_PATH: api_gateway
    depends_on:
      auth-service:
        condition: service_started   # дожидаемся запуска gRPC-сервисов
      course-service:
        condition: service_started
    restart: on-failure
    environment:
      AUTH_SERVICE_ADDR:   auth-service:50054
      COURSE_SERVICE_ADDR: course-service:50053
    ports:
      - "8080:8080"
    networks:
      - znaymed-net

################################################################################
# shared volumes / network
################################################################################
volumes:
  db_data:
  pgadmin_storage:

networks:
  znaymed-net:
    driver: bridge
